<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>youdown · 유튜브 영상·음원 다운로더</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>

    <main class="app">
      <header class="hero">
        <div class="brand">
          <span class="brand-mark">▶</span>
          <span class="brand-name">youdown</span>
        </div>
        <p class="hero-sub">
          링크만 붙여넣으면 영상(MP4) 또는 음원(MP3)으로 저장됩니다.
        </p>
      </header>

      <div id="status" class="status hidden" role="status">
        <span class="status-dot"></span>
        <span id="status-text"></span>
      </div>

      <section class="panel">
        <form id="url-form" class="url-form" autocomplete="off">
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 15l6-6M10.5 6.5l1-1a4.243 4.243 0 016 6l-1 1M13.5 17.5l-1 1a4.243 4.243 0 01-6-6l1-1"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input
              id="url"
              type="url"
              placeholder="https://youtube.com/watch?v=…"
              required
            />
          </div>
          <button id="fetch-btn" type="submit" class="btn btn-ghost">불러오기</button>
        </form>
        <p id="input-error" class="error hidden"></p>
      </section>

      <section id="preview" class="panel preview hidden">
        <div class="preview-media">
          <img id="thumb" alt="" />
          <span id="duration" class="duration-badge hidden"></span>
        </div>

        <div class="preview-body">
          <h2 id="title" class="preview-title"></h2>
          <p id="uploader" class="preview-uploader"></p>

          <div class="controls">
            <div class="control">
              <span class="control-label">형식</span>
              <div class="segmented" id="type-seg">
                <button type="button" class="seg active" data-type="video">
                  <span class="seg-emoji">🎬</span> 영상 · MP4
                </button>
                <button type="button" class="seg" data-type="audio">
                  <span class="seg-emoji">🎵</span> 음원 · MP3
                </button>
              </div>
            </div>

            <div class="control" id="quality-group">
              <span class="control-label">화질</span>
              <div class="select-wrap">
                <select id="quality">
                  <option value="best">최고 화질</option>
                  <option value="1080">1080p</option>
                  <option value="720" selected>720p</option>
                  <option value="480">480p</option>
                  <option value="360">360p</option>
                </select>
                <svg class="select-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>

          <button id="download-btn" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            다운로드
          </button>
        </div>
      </section>

      <section id="progress" class="panel progress hidden">
        <div class="progress-head">
          <span id="stage" class="progress-stage">준비 중</span>
          <span id="percent" class="progress-percent">0%</span>
        </div>
        <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
        <p id="progress-note" class="progress-note"></p>
      </section>

      <footer class="foot">
        <p class="disclaimer">
          저작권이 있는 콘텐츠는 정당한 권리 범위 내에서만 이용하세요.<br />
          개인적·합법적 용도 전용입니다.
        </p>
      </footer>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
