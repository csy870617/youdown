name: Download page

# site/ 의 다운로드 페이지를 GitHub Pages 로 배포
#  → https://csy870617.github.io/youdown/
on:
  push:
    paths:
      - "site/**"
      - "public/favicon.svg"
      - "public/favicon-32.png"
      - "public/apple-touch-icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: cp public/favicon.svg public/favicon-32.png public/apple-touch-icon.png site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
