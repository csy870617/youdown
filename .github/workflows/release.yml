name: Release

# Mac(터미널 한 줄 설치용 zip)·Windows(실행 파일)를 만들고, 실제 macOS·Windows
# 컴퓨터(러너)에서 설치·도구 자동 설치·실제 변환까지 테스트한 뒤 통과하면 릴리스.
#  - v로 시작하는 태그를 푸시하거나 (예: v1.2.0)
#  - Actions 탭에서 수동 실행(Run workflow) — 버전을 비우면 package.json 버전 사용
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 태그 (비우면 package.json 버전, 예: v1.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 빌드
  build-win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      - name: Build Windows executable
        run: npx pkg . --no-bytecode --public --targets node22-win-x64 --output dist/youdown-win.exe
      - uses: actions/upload-artifact@v4
        with:
          name: build-win
          path: dist/youdown-win.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      - name: Build executables (Apple Silicon + Intel)
        run: |
          npx pkg . --no-bytecode --public --targets node22-macos-arm64 --output dist/youdown-macos-arm64
          npx pkg . --no-bytecode --public --targets node22-macos-x64 --output dist/youdown-macos-x64
          # Apple Silicon 실행파일은 서명이 필수 → 없으면 ad-hoc 서명
          codesign --verify dist/youdown-macos-arm64 || codesign --force --sign - dist/youdown-macos-arm64
          codesign --verify dist/youdown-macos-arm64
          file dist/youdown-macos-*
      - name: Package youdown.app → zip
        run: bash scripts/make-macos-app.sh dist/youdown-macos-arm64 dist/youdown-macos-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: dist/youdown-mac.zip

  # ------------------------------------------------------ 실제 설치 테스트
  test-mac:
    needs: build-mac
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build-mac
          path: dist
      - name: Install with the one-line installer (방금 만든 zip 으로)
        run: |
          YOUDOWN_ZIP=dist/youdown-mac.zip YOUDOWN_NO_LAUNCH=1 bash scripts/install-mac.sh
          APP=/Applications/youdown.app; [ -d "$APP" ] || APP=~/Applications/youdown.app
          [ -x "$APP/Contents/MacOS/youdown" ]
          echo "APP=$APP" >> "$GITHUB_ENV"
      - name: Launch like double-clicking (LaunchServices)
        run: |
          if ! open --env YOUDOWN_NO_OPEN=1 --env YOUDOWN_IDLE_TICK_MS=3000 "$APP"; then
            YOUDOWN_NO_OPEN=1 YOUDOWN_IDLE_TICK_MS=3000 "$APP/Contents/MacOS/youdown"
          fi
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health; echo
          # Apple Silicon 러너에서는 네이티브 arm64 빌드가 실행되어야 함
          ps -axo command | grep -q '[y]oudown-bin-arm64'
      - name: Smoke test (tool setup + real conversion)
        run: node scripts/smoke-test.mjs
      - name: Clicking the app again reuses the running one
        run: |
          open --env YOUDOWN_NO_OPEN=1 "$APP" || YOUDOWN_NO_OPEN=1 "$APP/Contents/MacOS/youdown"
          sleep 5
          n=$(ps -axo command | grep -c '[y]oudown-bin')
          echo "running youdown processes: $n"
          [ "$n" = "1" ]
      - name: Quits by itself when no page is open
        run: |
          for i in $(seq 1 60); do pgrep -f youdown-bin >/dev/null || { echo "auto-quit after ~${i}s"; exit 0; }; sleep 1; done
          echo "did not quit"; exit 1
      - name: Auto-update replaces the app in place (예전 버전인 척 실행)
        run: |
          LATEST=$(curl -sI https://github.com/csy870617/youdown/releases/latest | grep -i '^location:' | sed -E 's#.*/tag/v?([^[:space:]]+).*#\1#' | tr -d '\r')
          echo "latest published: $LATEST"
          open --env YOUDOWN_NO_OPEN=1 --env YOUDOWN_FAKE_VERSION=0.0.1 "$APP" || YOUDOWN_NO_OPEN=1 YOUDOWN_FAKE_VERSION=0.0.1 "$APP/Contents/MacOS/youdown"
          for i in $(seq 1 120); do
            v=$(curl -sf http://127.0.0.1:3000/api/health | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])" 2>/dev/null || true)
            [ "$v" = "$LATEST" ] && { echo "updated to $v after ~${i}s"; break; }
            sleep 1
          done
          [ "$v" = "$LATEST" ]
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist" | grep -qx "$LATEST"
          [ ! -e "$(dirname "$APP")/.youdown-update" ]   # 임시·이전 버전 정리됨
          sleep 3; n=$(ps -axo command | grep -c '[y]oudown-bin'); echo "processes: $n"; [ "$n" = "1" ]
          pkill -f youdown-bin || true
      - name: Show app log
        if: always()
        run: cat ~/.youdown/youdown.log || true

  test-windows:
    needs: build-win
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      YOUDOWN_NO_OPEN: "1"
      YOUDOWN_IDLE_TICK_MS: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build-win
          path: dist
      - name: Run the downloaded exe (다운로드 폴더에서 바로 실행하듯)
        shell: pwsh
        run: |
          $dl = "$env:USERPROFILE\Downloads"; New-Item -ItemType Directory -Force $dl | Out-Null
          Copy-Item dist\youdown-win.exe "$dl\youdown-win.exe"
          Start-Process -FilePath "$dl\youdown-win.exe" -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:3000/api/health | ConvertTo-Json; break } catch { Start-Sleep 1 }
          }
      - name: Smoke test (tool setup + real conversion)
        run: node scripts/smoke-test.mjs
      - name: Running the exe again reuses the running one
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:USERPROFILE\Downloads\youdown-win.exe" -WindowStyle Hidden
          $n = @(Get-Process youdown-win -ErrorAction SilentlyContinue).Count
          Write-Host "running youdown processes: $n"
          if ($n -ne 1) { throw "중복 실행됨" }
      - name: Quits by itself when no page is open
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            if (-not (Get-Process youdown-win -ErrorAction SilentlyContinue)) { Write-Host "auto-quit after ~$i s"; exit 0 }
            Start-Sleep 1
          }
          throw "자동 종료되지 않음"
      - name: Auto-update replaces the exe in place (예전 버전인 척 실행)
        shell: pwsh
        run: |
          $r = Invoke-WebRequest https://github.com/csy870617/youdown/releases/latest -MaximumRedirection 0 -SkipHttpErrorCheck -ErrorAction SilentlyContinue
          $LATEST = ($r.Headers.Location -replace '.*/tag/v?','').Trim()
          Write-Host "latest published: $LATEST"
          $exe = "$env:USERPROFILE\Downloads\youdown-win.exe"
          $before = (Get-FileHash $exe).Hash
          $env:YOUDOWN_FAKE_VERSION = "0.0.1"
          Start-Process -FilePath $exe -WindowStyle Hidden
          $env:YOUDOWN_FAKE_VERSION = $null
          $v = ""
          for ($i = 0; $i -lt 120; $i++) {
            try { $v = (Invoke-RestMethod http://127.0.0.1:3000/api/health).version } catch {}
            if ($v -eq $LATEST) { Write-Host "updated to $v after ~$i s"; break }
            Start-Sleep 1
          }
          if ($v -ne $LATEST) { throw "업데이트되지 않음 (version=$v)" }
          if ((Get-FileHash $exe).Hash -eq $before) { throw "같은 자리의 exe 가 교체되지 않음" }
          if (Test-Path "$exe.new") { throw ".new 가 남아 있음" }
          Start-Sleep 3
          $n = @(Get-Process youdown-win -ErrorAction SilentlyContinue).Count
          Write-Host "processes: $n"; if ($n -ne 1) { throw "중복 실행됨" }
          Stop-Process -Name youdown-win -Force -ErrorAction SilentlyContinue
      - name: Show app log
        if: always()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\.youdown\youdown.log" -ErrorAction SilentlyContinue

  # --------------------------------------------------------------- 배포
  publish:
    needs: [test-mac, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - run: ls -la dist
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: youdown ${{ steps.tag.outputs.name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/youdown-mac.zip
            dist/youdown-win.exe
          body: |
            ## 다운로드
            👉 **https://csy870617.github.io/youdown/**

            **Mac** — 터미널에 붙여넣고 Enter (설치 후 바로 실행)
            ```
            curl -fsSL https://raw.githubusercontent.com/csy870617/youdown/HEAD/scripts/install-mac.sh | bash
            ```

            **Windows** — `youdown-win.exe` 를 받아서 실행
