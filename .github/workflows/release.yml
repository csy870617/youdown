name: Release

# 릴리스 실행파일 자동 빌드.
#  1) v로 시작하는 태그를 푸시하거나 (예: v1.0.0)
#  2) Actions 탭에서 수동 실행(Run workflow) 하며 버전을 입력하면
# 3개 OS용 실행파일을 빌드해 GitHub Releases 에 첨부합니다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 태그 (예: v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build executables (Windows / macOS / Linux)
        run: npm run build

      - name: List artifacts
        run: ls -la dist

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
