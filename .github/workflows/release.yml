name: Release

# 설치 파일을 만들고, 실제 macOS·Windows·Linux 컴퓨터(러너)에 설치해
# 도구 자동 설치와 실제 변환까지 테스트한 뒤, 모두 통과해야 릴리스한다.
#  - v로 시작하는 태그를 푸시하거나 (예: v1.1.0)
#  - Actions 탭에서 수동 실행(Run workflow) — 버전을 비우면 package.json 버전 사용
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 태그 (비우면 package.json 버전, 예: v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 빌드
  build-win-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      - name: Build executables
        run: |
          npx pkg . --no-bytecode --public --targets node22-linux-x64 --output dist/youdown-linux
          npx pkg . --no-bytecode --public --targets node22-win-x64 --output dist/youdown-win.exe
      - name: Build Windows installer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          makensis -V2 -DVERSION="$(node -p "require('./package.json').version")" scripts/windows-installer.nsi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-win-linux
          path: |
            dist/youdown-linux
            dist/youdown-win.exe
            dist/youdown-setup.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      - name: Build executables (Apple Silicon + Intel)
        run: |
          npx pkg . --no-bytecode --public --targets node22-macos-arm64 --output dist/youdown-macos-arm64
          npx pkg . --no-bytecode --public --targets node22-macos-x64 --output dist/youdown-macos-x64
          # Apple Silicon 실행파일은 서명이 필수 → 없으면 ad-hoc 서명
          codesign --verify dist/youdown-macos-arm64 || codesign --force --sign - dist/youdown-macos-arm64
          codesign --verify dist/youdown-macos-arm64
          file dist/youdown-macos-*
      - name: Package .app / .zip / .dmg
        run: bash scripts/make-macos-app.sh dist/youdown-macos-arm64 dist/youdown-macos-x64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: build-mac
          path: |
            dist/youdown-mac.zip
            dist/youdown-mac.dmg

  # ------------------------------------------------------ 실제 설치 테스트
  test-mac:
    needs: build-mac
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build-mac
          path: dist
      - name: Install from .dmg (like a user)
        run: |
          hdiutil attach dist/youdown-mac.dmg -nobrowse -mountpoint /Volumes/youdown
          ls -la /Volumes/youdown
          mkdir -p ~/Applications
          cp -R /Volumes/youdown/youdown.app ~/Applications/
          hdiutil detach /Volumes/youdown
      - name: Launch via Finder (LaunchServices)
        run: |
          if ! open --env YOUDOWN_NO_OPEN=1 --env YOUDOWN_IDLE_TICK_MS=3000 ~/Applications/youdown.app; then
            echo "open --env 미지원 → 런처 직접 실행"
            YOUDOWN_NO_OPEN=1 YOUDOWN_IDLE_TICK_MS=3000 ~/Applications/youdown.app/Contents/MacOS/youdown
          fi
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/health
          echo
          ps -axo pid,command | grep '[y]oudown-bin'
          # Apple Silicon 러너에서는 네이티브 arm64 빌드가 실행되어야 함
          ps -axo command | grep -q '[y]oudown-bin-arm64'
      - name: Smoke test (tool setup + real conversion)
        run: node scripts/smoke-test.mjs
      - name: Clicking the app again reuses the running one
        run: |
          open --env YOUDOWN_NO_OPEN=1 ~/Applications/youdown.app || YOUDOWN_NO_OPEN=1 ~/Applications/youdown.app/Contents/MacOS/youdown
          sleep 5
          n=$(ps -axo command | grep -c '[y]oudown-bin')
          echo "running youdown processes: $n"
          [ "$n" = "1" ]
      - name: Quits by itself when no page is open
        run: |
          for i in $(seq 1 60); do pgrep -f youdown-bin >/dev/null || { echo "auto-quit after ~${i}s"; exit 0; }; sleep 1; done
          echo "did not quit"; exit 1
      - name: Show app log
        if: always()
        run: cat ~/.youdown/youdown.log || true

  test-windows:
    needs: build-win-linux
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      YOUDOWN_NO_OPEN: "1"
      YOUDOWN_IDLE_TICK_MS: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build-win-linux
          path: dist
      - name: Run installer silently (like a user clicking through)
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath dist\youdown-setup.exe -ArgumentList "/S"
          $exe = "$env:LOCALAPPDATA\Programs\youdown\youdown.exe"
          if (!(Test-Path $exe)) { throw "설치되지 않음: $exe" }
          if (!(Test-Path "$env:USERPROFILE\Desktop\youdown.lnk")) { throw "바탕화면 바로가기 없음" }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\youdown"
      - name: Launch installed app
        shell: pwsh
        run: |
          Start-Process -FilePath "$env:LOCALAPPDATA\Programs\youdown\youdown.exe" -WindowStyle Hidden
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:3000/api/health | ConvertTo-Json; break } catch { Start-Sleep 1 }
          }
      - name: Smoke test (tool setup + real conversion)
        run: node scripts/smoke-test.mjs
      - name: Launching again reuses the running one
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Programs\youdown\youdown.exe" -WindowStyle Hidden
          $n = @(Get-Process youdown -ErrorAction SilentlyContinue).Count
          Write-Host "running youdown processes: $n"
          if ($n -ne 1) { throw "중복 실행됨" }
      - name: Quits by itself when no page is open
        shell: pwsh
        run: |
          for ($i = 0; $i -lt 60; $i++) {
            if (-not (Get-Process youdown -ErrorAction SilentlyContinue)) { Write-Host "auto-quit after ~$i s"; exit 0 }
            Start-Sleep 1
          }
          throw "자동 종료되지 않음"
      - name: Uninstall cleanly
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath "$env:LOCALAPPDATA\Programs\youdown\uninstall.exe" -ArgumentList "/S"
          # NSIS 제거 프로그램은 임시 복사본으로 넘기고 바로 반환하므로 완료를 기다림
          for ($i = 0; $i -lt 30; $i++) {
            if (-not (Test-Path "$env:LOCALAPPDATA\Programs\youdown\youdown.exe")) { Write-Host "uninstalled"; exit 0 }
            Start-Sleep 1
          }
          throw "제거되지 않음"
      - name: Show app log
        if: always()
        shell: pwsh
        run: Get-Content "$env:USERPROFILE\.youdown\youdown.log" -ErrorAction SilentlyContinue

  test-linux:
    needs: build-win-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: build-win-linux
          path: dist
      - name: Launch + smoke test
        run: |
          chmod +x dist/youdown-linux
          YOUDOWN_NO_OPEN=1 ./dist/youdown-linux &
          node scripts/smoke-test.mjs
      - name: Show app log
        if: always()
        run: cat ~/.youdown/youdown.log || true

  # --------------------------------------------------------------- 배포
  publish:
    needs: [test-mac, test-windows, test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "name=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - run: ls -la dist
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: youdown ${{ steps.tag.outputs.name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/youdown-mac.dmg
            dist/youdown-mac.zip
            dist/youdown-setup.exe
            dist/youdown-win.exe
            dist/youdown-linux
          body: |
            ## 다운로드
            👉 **다운로드 페이지:** https://csy870617.github.io/youdown/ (내 컴퓨터에 맞는 파일을 자동으로 골라 줍니다)

            | 컴퓨터 | 파일 |
            |---|---|
            | Mac (Apple Silicon·Intel 공용) | `youdown-mac.dmg` — 열어서 youdown 을 '응용 프로그램'으로 끌어다 놓기 |
            | Windows | `youdown-setup.exe` — 설치 후 바탕화면 아이콘으로 실행 |
            | Linux | `youdown-linux` |

            **Mac 경고 없이 한 줄 설치:** 터미널에 붙여넣기
            ```
            curl -fsSL https://raw.githubusercontent.com/csy870617/youdown/HEAD/scripts/install-mac.sh | bash
            ```
