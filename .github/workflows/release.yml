name: Release

# v로 시작하는 태그를 올리면(예: v1.0.0) 3개 OS용 실행파일을 빌드해
# GitHub Releases 에 자동으로 첨부합니다. 수동 실행(workflow_dispatch)도 가능.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build executables (Windows / macOS / Linux)
        run: npm run build

      - name: List artifacts
        run: ls -la dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
