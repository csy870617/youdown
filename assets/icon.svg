<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b7b"/>
      <stop offset="0.5" stop-color="#ff4747"/>
      <stop offset="1" stop-color="#d81f1f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#7a0000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#sheen)"/>
  </g>

  <!-- 재생 삼각형 (다운로드 화살표 겸) -->
  <path d="M424 350 L690 512 L424 674 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="48"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
